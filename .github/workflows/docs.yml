# Builds the developer docs (docs/, Hugo + AsciiDoc) and publishes them on
# GitHub Pages at every push that changes them.
name: Docs

on:
  push:
    branches: [master, main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo and Asciidoctor
        run: |
          wget -q -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          sudo apt-get update
          sudo apt-get install -y asciidoctor ruby-rouge

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        working-directory: docs
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
