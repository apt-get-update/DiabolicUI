<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f28"/><stop offset=".5" stop-color="#1c1714"/><stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c878"/><stop offset=".5" stop-color="#9a6a2c"/><stop offset="1" stop-color="#e0a640"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff4a20" stop-opacity=".85"/><stop offset=".55" stop-color="#b01408" stop-opacity=".4"/><stop offset="1" stop-color="#600804" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a50"/><stop offset="1" stop-color="#b01408"/></linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d82a14"/><stop offset="1" stop-color="#6a0a06"/></linearGradient>
  </defs>
  <!-- the iron plate, its bronze edge -->
  <rect x="10" y="10" width="236" height="236" rx="34" fill="url(#iron)" stroke="url(#bronze)" stroke-width="8"/>
  <rect x="24" y="24" width="208" height="208" rx="22" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="4"/>
  <!-- the gem, glowing -->
  <circle cx="128" cy="128" r="84" fill="url(#glow)"/>
  <polygon points="128,70 172,112 128,186 84,112" fill="url(#left)"/>
  <polygon points="128,70 172,112 128,186" fill="url(#right)"/>
  <polygon points="128,70 150,112 106,112" fill="#ffb090"/>
  <polygon points="84,112 106,112 128,186" fill="#e23a1c"/>
  <polygon points="172,112 150,112 128,186" fill="#8e0f08"/>
  <polygon points="106,112 150,112 128,186" fill="#c81e0e"/>
  <polyline points="128,70 172,112 128,186 84,112 128,70" fill="none" stroke="#2a0503" stroke-width="3" stroke-linejoin="round"/>
  <!-- the box around a picked part, its handles -->
  <rect x="58" y="58" width="140" height="140" fill="none" stroke="url(#bronze)" stroke-width="5"/>
  <g fill="#e0a640" stroke="#000" stroke-width="3">
    <rect x="47" y="47" width="22" height="22"/><rect x="187" y="47" width="22" height="22"/>
    <rect x="47" y="187" width="22" height="22"/><rect x="187" y="187" width="22" height="22"/>
    <rect x="120" y="50" width="16" height="16"/><rect x="120" y="190" width="16" height="16"/>
    <rect x="50" y="120" width="16" height="16"/><rect x="190" y="120" width="16" height="16"/>
  </g>
</svg>
