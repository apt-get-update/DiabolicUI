baseURL = '/'
locale = 'en-us'
title = 'DiabolicUI Developer Docs'
theme = 'hugo-book'

# Needed for hugo-book's search index and RSS-less setup.
disableKinds = ['RSS']

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = 'gruvbox'
    noClasses = false
  [markup.asciidocExt]
    [markup.asciidocExt.attributes]
      showtitle = true
      toc = true
      toclevels = 2
      idprefix = ''
      idseparator = '-'
      source-highlighter = 'rouge'
      rouge-style = 'gruvbox'
      rouge-css = 'style'

# Pages are AsciiDoc, rendered by the asciidoctor command.
[security.exec]
  allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^node$', '^postcss$', '^asciidoctor$']

[params]
  BookTheme = 'dark'
  BookLogo = 'images/logo.png'
  BookToC = true
  BookSection = 'docs'
  BookRepo = ''
  BookEditPath = ''
  BookSearch = true
  BookComments = false
  BookPortableLinks = true
  BookServiceWorker = false

[menu]
